[package]
name = "neutron-linux"
version = "0.1.0"
edition = "2024"
description = "Native Linux controller for the Behringer Neutron"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
midir = "=0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"

[profile.release]
strip = true
opt-level = 2
